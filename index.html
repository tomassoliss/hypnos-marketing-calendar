<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hypnos — Calendario Marketing 2026–2027</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --white:     #FFFFFF;
    --beige-clr: #EAE6E3;
    --beige-osc: #B3AAA1;
    --gris:      #BDBAB7;
    --capp:      #28211C;
    --font:      'DM Sans', Arial, sans-serif;
    --radius:    14px;
    --shadow:    0 4px 24px rgba(40,33,28,.10);
  }
  body { font-family: var(--font); background: var(--beige-clr); color: var(--capp); min-height: 100vh; }

  header {
    background: var(--capp);
    padding: 28px 40px 24px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
  }
  header .brand { display: flex; flex-direction: column; gap: 4px; }
  header .brand h1 { font-size: 22px; font-weight: 500; color: var(--white); letter-spacing: -.3px; }
  header .brand p  { font-size: 11px; font-weight: 300; color: var(--beige-osc); letter-spacing: .6px; text-transform: uppercase; }

  .header-right { text-align: right; }
  .refresh-btn {
    background: transparent; border: 1px solid var(--beige-osc); color: var(--beige-osc);
    font-family: var(--font); font-size: 11px; padding: 8px 16px; border-radius: 40px;
    cursor: pointer; letter-spacing: .4px; transition: all .2s;
  }
  .refresh-btn:hover { background: var(--beige-osc); color: var(--capp); }
  .refresh-btn:disabled { opacity: .5; cursor: default; }
  .sync-status { font-size: 11px; color: var(--beige-osc); margin-top: 6px; min-height: 16px; }

  .filters {
    background: var(--white); padding: 14px 40px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--beige-clr);
    position: sticky; top: 0; z-index: 10; flex-wrap: wrap;
  }
  .filters span { font-size: 11px; color: var(--beige-osc); text-transform: uppercase; letter-spacing: .5px; margin-right: 4px; }
  .pill {
    padding: 5px 14px; border-radius: 40px; border: 1px solid var(--gris);
    font-size: 12px; cursor: pointer; background: transparent; font-family: var(--font);
    color: var(--capp); transition: all .15s;
  }
  .pill.active, .pill:hover { background: var(--capp); color: var(--white); border-color: var(--capp); }

  .main { padding: 32px 40px; max-width: 1200px; margin: 0 auto; }

  .loading {
    text-align: center; padding: 80px 20px; color: var(--beige-osc);
  }
  .loading-spinner {
    width: 32px; height: 32px; border: 2px solid var(--gris);
    border-top-color: var(--capp); border-radius: 50%;
    animation: spin .8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box {
    background: var(--white); border-radius: var(--radius); padding: 28px 32px;
    max-width: 480px; margin: 60px auto;
  }
  .error-box p { font-size: 13px; color: var(--capp); line-height: 1.7; }
  .error-box small { color: var(--beige-osc); font-size: 11px; display: block; margin-top: 12px; }

  .month-block { margin-bottom: 44px; }
  .month-label {
    font-size: 13px; font-weight: 500; text-transform: uppercase;
    letter-spacing: 1.2px; color: var(--beige-osc); margin-bottom: 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .month-label::after { content: ''; flex: 1; height: 1px; background: var(--gris); }
  .month-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 12px; }

  .item-card {
    background: var(--white); border-radius: var(--radius);
    padding: 18px 20px; cursor: pointer; transition: transform .15s, box-shadow .15s;
    border-left: 3px solid transparent;
  }
  .item-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .item-card.launch    { border-left-color: var(--capp); }
  .item-card.comercial { border-left-color: var(--beige-osc); }
  .item-card.marketing { border-left-color: var(--gris); }
  .item-card.hito      { border-left-color: #8a7562; }
  .item-card.produccion{ border-left: 3px solid var(--beige-osc); border-top: 1px dashed var(--gris); border-right: 1px dashed var(--gris); border-bottom: 1px dashed var(--gris); }

  .card-type { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--beige-osc); margin-bottom: 6px; }
  .card-name { font-size: 14px; font-weight: 500; color: var(--capp); line-height: 1.4; margin-bottom: 8px; }
  .card-meta { font-size: 12px; color: var(--beige-osc); display: flex; align-items: center; justify-content: space-between; }

  .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
  .status-dot.lanzado, .status-dot.ejecutada, .status-dot.listo { background: #6aaa6a; }
  .status-dot.en-curso { background: #d4a843; }
  .status-dot.pendiente { background: var(--gris); }
  .status-dot.pausado   { background: #c0504d; }

  .budget-badge { font-size: 11px; background: var(--beige-clr); padding: 3px 9px; border-radius: 20px; color: var(--capp); font-weight: 500; }

  .overlay {
    position: fixed; inset: 0; background: rgba(40,33,28,.35); z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .overlay.open { opacity: 1; pointer-events: all; }

  .drawer {
    position: fixed; right: 0; top: 0; bottom: 0; width: min(520px,95vw);
    background: var(--white); z-index: 101;
    transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1);
    overflow-y: auto; display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }

  .drawer-header { background: var(--capp); padding: 28px 28px 24px; position: sticky; top: 0; z-index: 2; }
  .drawer-close {
    position: absolute; top: 20px; right: 20px;
    background: rgba(255,255,255,.12); border: none; color: var(--white);
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    font-size: 16px; display: flex; align-items: center; justify-content: center; transition: background .15s;
  }
  .drawer-close:hover { background: rgba(255,255,255,.22); }
  .drawer-type { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--beige-osc); margin-bottom: 8px; }
  .drawer-name { font-size: 20px; font-weight: 500; color: var(--white); line-height: 1.3; margin-bottom: 12px; padding-right: 36px; }
  .drawer-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .drawer-chip { font-size: 11px; padding: 4px 12px; border-radius: 20px; background: rgba(255,255,255,.10); color: var(--beige-clr); }

  .drawer-body { padding: 28px; flex: 1; }

  .section-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--beige-osc); margin-bottom: 12px; margin-top: 28px;
    padding-bottom: 8px; border-bottom: 1px solid var(--beige-clr);
  }
  .section-title:first-child { margin-top: 0; }

  .description-box { font-size: 13px; line-height: 1.7; color: var(--capp); font-weight: 300; }

  .budget-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .budget-table th { text-align: left; font-weight: 500; font-size: 11px; color: var(--beige-osc); padding: 7px 10px; background: var(--beige-clr); }
  .budget-table td { padding: 10px 10px; border-bottom: 1px solid var(--beige-clr); color: var(--capp); vertical-align: top; }
  .budget-table tr:last-child td { border-bottom: none; }
  .budget-total {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--capp); color: var(--white); padding: 14px 16px;
    border-radius: 10px; margin-top: 14px; font-size: 14px; font-weight: 500;
  }
  .budget-total .amount { font-size: 18px; }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .info-item { background: var(--beige-clr); border-radius: 10px; padding: 12px 14px; }
  .info-item label { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--beige-osc); display: block; margin-bottom: 4px; }
  .info-item span { font-size: 13px; font-weight: 500; color: var(--capp); }

  /* Barra de progreso checklist */
  .progress-wrap { display: flex; align-items: center; gap: 12px; }
  .progress-bar { flex: 1; height: 6px; background: var(--beige-clr); border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--capp); border-radius: 10px; transition: width .4s; }
  .progress-label { font-size: 12px; color: var(--beige-osc); white-space: nowrap; }

  .notes-box { background: var(--beige-clr); border-radius: 10px; padding: 14px 16px; font-size: 13px; line-height: 1.6; color: var(--capp); }

  /* Hitos individuales */
  .hitos-list { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
  .hito-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; background: var(--beige-clr); }
  .hito-dot { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--gris); display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; color: transparent; }
  .hito-item.done .hito-dot { background: var(--capp); border-color: var(--capp); color: var(--white); }
  .hito-text { font-size: 13px; color: var(--capp); line-height: 1.3; }
  .hito-item.done .hito-text { color: var(--beige-osc); text-decoration: line-through; }

  /* Presupuesto colapsable */
  .section-title-toggle {
    font-size: 14px; font-weight: 500; letter-spacing: .1px;
    color: var(--white); margin-bottom: 0; margin-top: 28px;
    padding: 14px 16px; border-radius: 10px; background: var(--capp);
    display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
    transition: opacity .15s;
  }
  .section-title-toggle:hover { opacity: .88; }
  .section-title-toggle .ppto-note { font-size: 11px; font-weight: 300; color: var(--beige-osc); }
  .section-title-toggle .ppto-total { margin-left: auto; font-size: 18px; font-weight: 500; color: var(--white); }
  .section-title-toggle .toggle-arrow { font-size: 12px; color: var(--beige-osc); margin-left: 4px; }
  .collapsible-body { padding-top: 14px; }

  .empty { text-align: center; padding: 48px 20px; color: var(--beige-osc); font-size: 14px; }

  @media (max-width: 680px) {
    header, .filters, .main { padding-left: 20px; padding-right: 20px; }
    .month-items { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>hypnos</h1>
    <p>calendario de marketing 2026 – 2027</p>
  </div>
  <div class="header-right">
    <button class="refresh-btn" id="refreshBtn" onclick="cargarDatos()">↻ actualizar</button>
    <div class="sync-status" id="syncStatus"></div>
  </div>
</header>

<div class="filters">
  <span>ver</span>
  <button class="pill active" onclick="filter('all',this)">todo</button>
  <button class="pill"        onclick="filter('launch',this)">lanzamientos</button>
  <button class="pill"        onclick="filter('comercial',this)">comerciales</button>
  <button class="pill"        onclick="filter('marketing',this)">marketing</button>
  <button class="pill"        onclick="filter('hito',this)">hitos de marca</button>
  <button class="pill"        onclick="filter('produccion',this)">producción</button>
</div>

<div class="main" id="calendar">
  <div class="loading">
    <div class="loading-spinner"></div>
    <p>Cargando calendario...</p>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
    <div class="drawer-type"  id="d-type"></div>
    <div class="drawer-name"  id="d-name"></div>
    <div class="drawer-chips" id="d-chips"></div>
  </div>
  <div class="drawer-body" id="d-body"></div>
</div>

<script>
// ── APPS SCRIPT URL ───────────────────────────────────────────────────────
const SHEET_URL = "https://script.google.com/macros/s/AKfycbxpxTY_T167JQaW26KXT3LsfPBNRVq_vTxWkfkBnDIf-e8i4BP0A2dqvefvQ3d2Oh2xBw/exec";

// ── DATOS ─────────────────────────────────────────────────────────────────
let ITEMS = [];

// ── HELPERS ───────────────────────────────────────────────────────────────
const MONTHS = [
  {key:'2026-09',label:'Septiembre 2026'},{key:'2026-10',label:'Octubre 2026'},
  {key:'2026-11',label:'Noviembre 2026'},{key:'2026-12',label:'Diciembre 2026'},
  {key:'2027-01',label:'Enero 2027'},{key:'2027-02',label:'Febrero 2027'},
  {key:'2027-03',label:'Marzo 2027'},{key:'2027-04',label:'Abril 2027'},
  {key:'2027-05',label:'Mayo 2027'},{key:'2027-06',label:'Junio 2027'},
  {key:'2027-07',label:'Julio 2027'},{key:'2027-08',label:'Agosto 2027'},
  {key:'2027-09',label:'Septiembre 2027'},{key:'2027-10',label:'Octubre 2027'},
  {key:'2027-11',label:'Noviembre 2027'},{key:'2027-12',label:'Diciembre 2027'},
];

const TYPE_LABEL = {
  launch:'Lanzamiento', comercial:'Campaña comercial',
  marketing:'Campaña de marketing', hito:'Hito de marca', produccion:'Producción'
};

// Mapeos desde los valores del Sheet
const MONTH_MAP = {
  'Sep 2026':'2026-09','Oct 2026':'2026-10','Nov 2026':'2026-11','Dic 2026':'2026-12',
  'Ene 2027':'2027-01','Feb 2027':'2027-02','Mar 2027':'2027-03','Abr 2027':'2027-04',
  'May 2027':'2027-05','Jun 2027':'2027-06','Jul 2027':'2027-07','Ago 2027':'2027-08',
  'Sep 2027':'2027-09','Oct 2027':'2027-10','Nov 2027':'2027-11','Dic 2027':'2027-12',
};
const TYPE_MAP = {
  'Lanzamiento':'launch','Campaña comercial':'comercial',
  'Campaña de marketing':'marketing','Hito de marca':'hito','Producción':'produccion'
};
const STATUS_MAP = {
  'Sin empezar':'pendiente','En curso':'en-curso','Listo':'listo','Pausado':'pausado'
};
const STATUS_LABEL = {
  pendiente:'Sin empezar','en-curso':'En curso',listo:'Listo',
  ejecutada:'Ejecutada',lanzado:'Lanzado',pausado:'Pausado'
};

function clp(n) { return n ? '$'+Number(n).toLocaleString('es-CL') : '—'; }

let activeFilter = 'all';

// ── CARGAR DATOS DESDE APPS SCRIPT ───────────────────────────────────────
async function cargarDatos() {
  const btn    = document.getElementById('refreshBtn');
  const status = document.getElementById('syncStatus');
  const cal    = document.getElementById('calendar');

  btn.disabled = true;
  btn.textContent = '↻ cargando…';
  status.textContent = '';

  if (ITEMS.length === 0) {
    cal.innerHTML = `<div class="loading"><div class="loading-spinner"></div><p>Cargando calendario...</p></div>`;
  }

  try {
    const res = await fetch(SHEET_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.ok) throw new Error('Respuesta inválida del servidor');

    // Mapear campos del sheet a estructura interna
    ITEMS = data.items.map(r => ({
      id:          r.id,
      month:       MONTH_MAP[r.mes] || r.mes,
      type:        TYPE_MAP[r.tipo] || 'hito',
      name:        r.nombre || '',
      status:      STATUS_MAP[r.estado] || 'pendiente',
      canal:       r.canales || '',
      descripcion: r.descripcion || '',
      checklist:   (r.checklist || []).map(c => ({ t: c.tarea, done: c.done })),
      gastos:      r.gastos || [],
      totalGastos: r.totalGastos || 0,
    }));

    render();
    const hora = new Date(data.actualizado).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
    status.textContent = 'actualizado ' + hora;
    status.style.color = '#6aaa6a';
  } catch(e) {
    console.error(e);
    if (ITEMS.length === 0) {
      cal.innerHTML = `
        <div class="error-box">
          <p>No se pudo cargar el calendario desde Google Sheets.</p>
          <p>Revisa que el Apps Script esté desplegado correctamente y que la URL sea la correcta.</p>
          <small>Error técnico: ${e.message}</small>
        </div>`;
    }
    status.textContent = 'error al actualizar';
    status.style.color = '#c0504d';
  }

  btn.disabled = false;
  btn.textContent = '↻ actualizar';
}

// ── RENDER CALENDAR ───────────────────────────────────────────────────────
function render() {
  const items = ITEMS.filter(i => activeFilter === 'all' || i.type === activeFilter);
  let html = '';
  MONTHS.forEach(m => {
    const mis = items.filter(i => i.month === m.key);
    if (!mis.length) return;
    html += `<div class="month-block">
      <div class="month-label">${m.label}</div>
      <div class="month-items">`;
    mis.forEach(item => {
      html += `
        <div class="item-card ${item.type}" onclick="openDrawer('${item.id}')">
          <div class="card-type">${TYPE_LABEL[item.type] || item.type}</div>
          <div class="card-name">${item.name}</div>
          <div class="card-meta">
            <span><span class="status-dot ${item.status}"></span>${STATUS_LABEL[item.status] || item.status}</span>
            ${item.totalGastos ? `<span class="budget-badge">${clp(item.totalGastos)}</span>` : ''}
          </div>
        </div>`;
    });
    html += `</div></div>`;
  });
  document.getElementById('calendar').innerHTML = html || '<div class="empty">No hay ítems para este filtro.</div>';
}

function filter(type, btn) {
  activeFilter = type;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ── DRAWER ────────────────────────────────────────────────────────────────
function openDrawer(id) {
  const item = ITEMS.find(i => i.id === id);
  if (!item) return;

  document.getElementById('d-type').textContent = TYPE_LABEL[item.type] || item.type;
  document.getElementById('d-name').textContent = item.name;
  document.getElementById('d-chips').innerHTML = [
    MONTHS.find(m => m.key === item.month)?.label || item.month,
    STATUS_LABEL[item.status] || item.status
  ].map(c => `<span class="drawer-chip">${c}</span>`).join('');

  let body = '';

  if (item.descripcion) {
    body += `<div class="section-title">descripción</div>
    <div class="description-box">${item.descripcion}</div>`;
  }

  const tieneTiendaFisica = (item.canal || '').toLowerCase().includes('tienda');
  body += `<div class="section-title">información</div>
  <div class="info-grid">
    <div class="info-item"><label>Estado</label><span><span class="status-dot ${item.status}"></span> ${STATUS_LABEL[item.status] || item.status}</span></div>
    <div class="info-item"><label>Período</label><span>${MONTHS.find(m => m.key === item.month)?.label || item.month}</span></div>
    ${tieneTiendaFisica ? `<div class="info-item" style="grid-column:1/-1"><label>Incluye tienda física</label><span>${item.canal}</span></div>` : ''}
  </div>`;

  // Hitos / progreso (checklist)
  if (item.checklist?.length) {
    const done = item.checklist.filter(c => c.done).length;
    const pct  = Math.round(done / item.checklist.length * 100);
    body += `<div class="section-title">hitos</div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <span class="progress-label">${done} de ${item.checklist.length} completados</span>
    </div>
    <div class="hitos-list">`;
    item.checklist.forEach(c => {
      body += `<div class="hito-item${c.done ? ' done' : ''}">
        <div class="hito-dot">${c.done ? '✓' : ''}</div>
        <span class="hito-text">${c.t}</span>
      </div>`;
    });
    body += `</div>`;
  }

  // Presupuesto colapsable
  const hasGastos = item.gastos && item.gastos.length;
  const pptoId = 'ppto-' + item.id;
  body += `<div class="section-title-toggle" onclick="togglePpto('${pptoId}')">
    presupuesto
    <span class="ppto-note">(productos: costo neto)</span>
    ${item.totalGastos ? `<span class="ppto-total">${clp(item.totalGastos)}</span>` : ''}
    <span class="toggle-arrow" id="arrow-${pptoId}">▾</span>
  </div>
  <div id="${pptoId}" class="collapsible-body" style="display:none">`;
  if (hasGastos) {
    body += `<table class="budget-table">
      <tr><th>Ítem</th><th>Categoría</th><th style="text-align:right">Monto</th></tr>`;
    item.gastos.forEach(g => {
      const monto = g.tipo === 'Canje' && g.costoNeto > 0 ? g.costoNeto : g.monto;
      const tipoTag = g.tipo === 'Canje'
        ? ` <span style="font-size:10px;background:var(--beige-clr);padding:2px 7px;border-radius:20px;color:var(--beige-osc)">canje</span>`
        : '';
      body += `<tr>
        <td>${g.item}${tipoTag}</td>
        <td style="font-size:11px;color:var(--beige-osc)">${g.categoria || '—'}</td>
        <td style="text-align:right;font-weight:500">${clp(monto)}</td>
      </tr>`;
    });
    body += `</table>
    <div class="budget-total"><span>Total campaña</span><span class="amount">${clp(item.totalGastos)}</span></div>`;
  } else {
    body += `<div class="notes-box" style="color:var(--beige-osc)">Sin gastos asignados a esta campaña.</div>`;
  }
  body += `</div>`;

  document.getElementById('d-body').innerHTML = body;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer').scrollTop = 0;
}

function togglePpto(id) {
  const el = document.getElementById(id);
  const arrow = document.getElementById('arrow-' + id);
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'block';
  arrow.textContent = open ? '▾' : '▴';
}

function closeDrawer() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

// Cargar al abrir la página
cargarDatos();
</script>
</body>
